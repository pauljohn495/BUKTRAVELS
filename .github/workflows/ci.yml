name: CI

on:
  push:
  pull_request:

jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: buktravels_test
          POSTGRES_USER: buktravels
          POSTGRES_PASSWORD: buktravels_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buktravels -d buktravels_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php vendor/bin/pint --test
      - run: php vendor/bin/phpunit -c phpunit.postgres.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: buktravels-api:test
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: buktravels-web:test
