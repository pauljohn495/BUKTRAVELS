services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: buktravels
      POSTGRES_USER: buktravels
      POSTGRES_PASSWORD: buktravels_local
    ports:
      - "5432:5432"
    volumes:
      - buktravels_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buktravels -d buktravels"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  buktravels_postgres:
